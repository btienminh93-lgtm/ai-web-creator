<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web Creator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: black;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚀 AI Web Creator</h1>

    <p>Nhập yêu cầu website:</p>

    <textarea
      id="request"
      placeholder="Ví dụ: Tạo website bán giày..."
    ></textarea>

    <button onclick="createWebsite()">
      Tạo website
    </button>

    <div id="result">
      Website sẽ xuất hiện ở đây.
    </div>

  </div>

  <script>
    function createWebsite() {
      const request = document.getElementById("request").value;

      if (request.trim() === "") {
        alert("Hãy nhập yêu cầu!");
        return;
      }

      document.getElementById("result").innerHTML =
        "<h2>Website đã tạo!</h2>" +
        "<p>Yêu cầu của bạn:</p>" +
        "<strong>" + request + "</strong>";
    }
  </script>

</body>
</html>
